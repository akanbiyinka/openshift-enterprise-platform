name: Build-Push-Deploy

on:

  workflow_run:

    workflows:
      - Build-Test-Scan

    branches:
      - main

    types:
      - completed

permissions:
  contents: read
  packages: write

env:

  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/openshift-enterprise-platform

jobs:

  deploy:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          oc version --client

      - name: Login to OpenShift
        run: |
          oc login \
            --server="${{ secrets.OPENSHIFT_SERVER }}" \
            --token="${{ secrets.OPENSHIFT_TOKEN }}" \
            --insecure-skip-tls-verify=true

      - name: Update Deployment Image
        run: |
          sed -i "s|ghcr.io/<your-github-username>/openshift-enterprise-platform:latest|${IMAGE_NAME}:${GITHUB_SHA}|g" openshift/deployment.yaml

      - name: Deploy
        run: |
          oc apply -f openshift/

      - name: Wait for Rollout
        run: |
          oc rollout status deployment/openshift-app -n openshift-enterprise-platform --timeout=300s