name: Build-Test-Scan

on:
  pull_request:
    branches:
      - main
      - Openbranch

  push:
    branches:
      - main
      - Openbranch
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest tests/

      - name: Build Docker Image
        run: |
          docker build -t openshift-enterprise-platform .
