apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "openshift-app.fullname" . }}

spec:

  replicas: {{ .Values.replicaCount }}

  selector:

    matchLabels:

      app: {{ include "openshift-app.name" . }}

  template:

    metadata:

      labels:

        app: {{ include "openshift-app.name" . }}

    spec:

      serviceAccountName: {{ include "openshift-app.fullname" . }}

      containers:

      - name: {{ include "openshift-app.name" . }}

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        imagePullPolicy: {{ .Values.image.pullPolicy }}

        ports:

        - containerPort: {{ .Values.container.port }}

        envFrom:

        - configMapRef:

            name: {{ include "openshift-app.fullname" . }}-config

        - secretRef:

            name: {{ include "openshift-app.fullname" . }}-secret

        resources:

{{ toYaml .Values.resources | indent 10 }}

        readinessProbe:

          httpGet:

            path: /ready

            port: {{ .Values.container.port }}

          initialDelaySeconds: 5

        livenessProbe:

          httpGet:

            path: /health

            port: {{ .Values.container.port }}

          initialDelaySeconds: 15

        securityContext:

          runAsNonRoot: true

          allowPrivilegeEscalation: false

          capabilities:

            drop:
              - ALL