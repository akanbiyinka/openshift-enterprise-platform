replicaCount: 2

app:
  name: OpenShift Enterprise Platform
  version: "1.0.0"

image:
  repository: ghcr.io/akanbiyinka/openshift-enterprise-platform
  tag: latest
  pullPolicy: Always

container:
  port: 8080

service:
  type: ClusterIP
  port: 80

secret:
  apiKey: change-me

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

route:
  enabled: true

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpu: 70