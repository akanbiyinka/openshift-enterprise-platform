apiVersion: apps/v1
kind: Deployment

metadata:

  name: openshift-app

  namespace: openshift-enterprise-platform

  labels:
    app: openshift-app

spec:

  replicas: 2

  selector:
    matchLabels:
      app: openshift-app

  template:

    metadata:
      labels:
        app: openshift-app

    spec:

      serviceAccountName: openshift-app

      containers:

      - name: openshift-app

        image: ghcr.io/akanbiyinka/openshift-enterprise-platform:latest
               imagePullPolicy: Always

        imagePullPolicy: Always

        ports:

        - containerPort: 8080

        envFrom:

        - configMapRef:
            name: app-config

        - secretRef:
            name: app-secret

        resources:

          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 500m
            memory: 512Mi

        readinessProbe:

          httpGet:
            path: /ready
            port: 8080

          initialDelaySeconds: 5

          periodSeconds: 10

        livenessProbe:

          httpGet:
            path: /health
            port: 8080

          initialDelaySeconds: 20

          periodSeconds: 15

        securityContext:

          allowPrivilegeEscalation: false

          capabilities:
            drop:
            - ALL

          runAsNonRoot: true